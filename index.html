<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mona Lisa Interativa - Alura</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 Mona Lisa Interativa</h1>
            <p class="subtitle">Leonardo da Vinci - Movimente o mouse sobre os olhos</p>
        </header>
        
        <div class="canvas-wrapper">
            <svg class="mona-lisa" viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg">
                <!-- Definição de gradientes e filtros -->
                <defs>
                    <!-- Gradiente do céu -->
                    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#A0C4D4;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#B8D4E0;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#C5D9E8;stop-opacity:1" />
                    </linearGradient>
                    
                    <!-- Gradiente do terreno -->
                    <linearGradient id="terrainGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#7A8A6A;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#6B7B5C;stop-opacity:1" />
                    </linearGradient>
                    
                    <!-- Gradiente da pele -->
                    <radialGradient id="skinGradient" cx="40%" cy="40%">
                        <stop offset="0%" style="stop-color:#E8D4B8;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#D4B896;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#C4A878;stop-opacity:1" />
                    </radialGradient>
                    
                    <!-- Gradiente dos olhos (branco) -->
                    <radialGradient id="eyeWhiteGradient" cx="40%" cy="40%">
                        <stop offset="0%" style="stop-color:#FFFEF0;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#F0E8D8;stop-opacity:1" />
                    </radialGradient>
                    
                    <!-- Gradiente da íris -->
                    <radialGradient id="irisGradient" cx="35%" cy="35%">
                        <stop offset="0%" style="stop-color:#8B6F47;stop-opacity:1" />
                        <stop offset="70%" style="stop-color:#6B5335;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#4A3A23;stop-opacity:1" />
                    </radialGradient>
                    
                    <!-- Filtro de sombra -->
                    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
                        <feOffset dx="1" dy="2" result="offsetblur"/>
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.3"/>
                        </feComponentTransfer>
                        <feMerge>
                            <feMergeNode/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                
                <!-- FUNDO DA PAISAGEM -->
                <rect width="500" height="700" fill="url(#skyGradient)"/>
                
                <!-- Montanhas e paisagem ao fundo -->
                <path d="M 0 450 Q 100 350 200 400 T 400 380 T 500 420 L 500 700 L 0 700 Z" fill="#7A8A6A" opacity="0.4"/>
                <path d="M 0 500 Q 150 400 250 450 T 500 480 L 500 700 L 0 700 Z" fill="#6B7B5C" opacity="0.5"/>
                
                <!-- Rio/Caminho ao fundo -->
                <path d="M 150 500 Q 250 550 350 480" stroke="#9AADBE" stroke-width="8" fill="none" opacity="0.6"/>
                
                <!-- CORPO E VESTUÁRIO -->
                
                <!-- Pescoço -->
                <ellipse cx="250" cy="400" rx="32" ry="60" fill="url(#skinGradient)" filter="url(#shadow)"/>
                
                <!-- Ombros e corpo (vestido) -->
                <path d="M 200 440 Q 150 480 140 580 L 140 700 L 360 700 L 360 580 Q 350 480 300 440 Z" fill="#8B4513" opacity="0.7"/>
                <path d="M 200 440 Q 160 470 155 550 L 155 700 L 345 700 L 340 550 Q 335 470 300 440 Z" fill="#A0522D" opacity="0.5"/>
                
                <!-- Decote e detalhes do vestido -->
                <ellipse cx="250" cy="450" rx="60" ry="25" fill="#8B4513" opacity="0.8"/>
                <path d="M 220 460 Q 250 455 280 460" stroke="#6B3410" stroke-width="1" fill="none" opacity="0.6"/>
                
                <!-- CABEÇA -->
                <ellipse cx="250" cy="280" rx="90" ry="110" fill="url(#skinGradient)" filter="url(#shadow)"/>
                
                <!-- Sombras do rosto para profundidade -->
                <ellipse cx="190" cy="300" rx="35" ry="80" fill="#C4A878" opacity="0.2"/>
                <ellipse cx="310" cy="300" rx="35" ry="80" fill="#C4A878" opacity="0.15"/>
                
                <!-- Queixo e mandíbula -->
                <ellipse cx="250" cy="370" rx="50" ry="35" fill="#D4B896" opacity="0.6"/>
                
                <!-- CABELO -->
                <!-- Cabelo principal - parte de trás -->
                <path d="M 160 200 Q 150 120 180 80 Q 220 40 250 30 Q 280 40 320 80 Q 350 120 340 200" fill="#5C4033" filter="url(#shadow)"/>
                
                <!-- Cabelo - mechas laterais esquerda -->
                <path d="M 160 200 Q 140 240 145 320 Q 148 360 160 380" stroke="#5C4033" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M 155 220 Q 135 260 138 320" stroke="#4A2C1A" stroke-width="4" fill="none" opacity="0.5" stroke-linecap="round"/>
                
                <!-- Cabelo - mechas laterais direita -->
                <path d="M 340 200 Q 360 240 355 320 Q 352 360 340 380" stroke="#5C4033" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M 345 220 Q 365 260 362 320" stroke="#4A2C1A" stroke-width="4" fill="none" opacity="0.5" stroke-linecap="round"/>
                
                <!-- Franja de cabelo -->
                <path d="M 190 170 Q 210 160 230 165 Q 250 160 270 165 Q 290 160 310 170" stroke="#5C4033" stroke-width="6" fill="none" stroke-linecap="round"/>
                
                <!-- ORELHAS -->
                <!-- Orelha esquerda -->
                <ellipse cx="155" cy="250" rx="22" ry="45" fill="url(#skinGradient)" filter="url(#shadow)"/>
                <ellipse cx="160" cy="260" rx="10" ry="25" fill="#C4A878" opacity="0.5"/>
                <path d="M 162 250 Q 165 260 162 275" stroke="#A89878" stroke-width="1" fill="none" opacity="0.4"/>
                
                <!-- Orelha direita -->
                <ellipse cx="345" cy="250" rx="22" ry="45" fill="url(#skinGradient)" filter="url(#shadow)"/>
                <ellipse cx="340" cy="260" rx="10" ry="25" fill="#C4A878" opacity="0.5"/>
                <path d="M 338 250 Q 335 260 338 275" stroke="#A89878" stroke-width="1" fill="none" opacity="0.4"/>
                
                <!-- OLHOS - Estrutura principal -->
                
                <!-- Olho esquerdo -->
                <g id="eye-left">
                    <!-- Branco do olho -->
                    <ellipse cx="205" cy="240" rx="22" ry="32" fill="url(#eyeWhiteGradient)" filter="url(#shadow)"/>
                    
                    <!-- Sombra superior do olho -->
                    <path d="M 185 220 Q 205 210 225 220" stroke="#C4A878" stroke-width="2" fill="none" opacity="0.5"/>
                    
                    <!-- Sombra inferior do olho -->
                    <path d="M 185 260 Q 205 270 225 260" stroke="#A89878" stroke-width="1.5" fill="none" opacity="0.4"/>
                </g>
                
                <!-- Olho direito -->
                <g id="eye-right">
                    <!-- Branco do olho -->
                    <ellipse cx="295" cy="240" rx="22" ry="32" fill="url(#eyeWhiteGradient)" filter="url(#shadow)"/>
                    
                    <!-- Sombra superior do olho -->
                    <path d="M 275 220 Q 295 210 315 220" stroke="#C4A878" stroke-width="2" fill="none" opacity="0.5"/>
                    
                    <!-- Sombra inferior do olho -->
                    <path d="M 275 260 Q 295 270 315 260" stroke="#A89878" stroke-width="1.5" fill="none" opacity="0.4"/>
                </g>
                
                <!-- ÍRIS ESQUERDA (vai se mover com o mouse) -->
                <circle class="iris iris-esquerda" cx="205" cy="245" r="14" fill="url(#irisGradient)"/>
                <!-- Pupila esquerda -->
                <circle class="pupila" cx="205" cy="245" r="8" fill="#2A1810"/>
                <!-- Brilho esquerdo -->
                <circle cx="207" cy="242" r="3" fill="#FFFFFF" opacity="0.9"/>
                <circle cx="203" cy="248" r="1.5" fill="#FFFFFF" opacity="0.5"/>
                
                <!-- ÍRIS DIREITA (vai se mover com o mouse) -->
                <circle class="iris iris-direita" cx="295" cy="245" r="14" fill="url(#irisGradient)"/>
                <!-- Pupila direita -->
                <circle class="pupila" cx="295" cy="245" r="8" fill="#2A1810"/>
                <!-- Brilho direito -->
                <circle cx="297" cy="242" r="3" fill="#FFFFFF" opacity="0.9"/>
                <circle cx="293" cy="248" r="1.5" fill="#FFFFFF" opacity="0.5"/>
                
                <!-- SOBRANCELHAS -->
                <!-- Sobrancelha esquerda -->
                <path d="M 185 210 Q 205 195 225 210" stroke="#5C4033" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#shadow)"/>
                <path d="M 185 210 Q 205 200 225 210" stroke="#4A2C1A" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round"/>
                
                <!-- Sobrancelha direita -->
                <path d="M 275 210 Q 295 195 315 210" stroke="#5C4033" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#shadow)"/>
                <path d="M 275 210 Q 295 200 315 210" stroke="#4A2C1A" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round"/>
                
                <!-- NARIZ -->
                <path d="M 250 240 L 250 310 L 245 318 M 250 310 L 255 318" stroke="#C4A878" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
                <!-- Sombra do nariz -->
                <path d="M 248 245 L 248 310" stroke="#B89860" stroke-width="1" fill="none" opacity="0.4"/>
                
                <!-- BOCA - O famoso sorriso misterioso -->
                <!-- Linha principal da boca -->
                <path d="M 200 340 Q 220 355 250 358 Q 280 355 300 340" stroke="#B8714F" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#shadow)"/>
                
                <!-- Sombra dentro da boca (lábio inferior) -->
                <path d="M 200 342 Q 220 358 250 360 Q 280 358 300 342" fill="#D4A574" opacity="0.4"/>
                
                <!-- Detalhes do sorriso -->
                <path d="M 215 350 Q 220 355 225 352" stroke="#A85A42" stroke-width="1" fill="none" opacity="0.5" stroke-linecap="round"/>
                <path d="M 275 350 Q 280 355 285 352" stroke="#A85A42" stroke-width="1" fill="none" opacity="0.5" stroke-linecap="round"/>
                
                <!-- RUGAS E EXPRESSÕES -->
                <!-- Rugas ao redor dos olhos -->
                <path d="M 230 230 Q 235 225 240 230" stroke="#C4A878" stroke-width="0.8" fill="none" opacity="0.3"/>
                <path d="M 270 230 Q 265 225 260 230" stroke="#C4A878" stroke-width="0.8" fill="none" opacity="0.3"/>
                
                <!-- Linhas de expressão próximo à boca -->
                <path d="M 180 330 Q 185 340 188 350" stroke="#C4A878" stroke-width="0.5" fill="none" opacity="0.3"/>
                <path d="M 320 330 Q 315 340 312 350" stroke="#C4A878" stroke-width="0.5" fill="none" opacity="0.3"/>
                
                <!-- MÃOS (visão lateral) -->
                <!-- Mão esquerda descansando -->
                <g filter="url(#shadow)">
                    <ellipse cx="110" cy="520" rx="25" ry="45" fill="url(#skinGradient)"/>
                    <!-- Dedos -->
                    <ellipse cx="95" cy="540" rx="6" ry="18" fill="#D4B896" opacity="0.8"/>
                    <ellipse cx="105" cy="555" rx="5" ry="20" fill="#D4B896" opacity="0.8"/>
                    <ellipse cx="118" cy="560" rx="6" ry="18" fill="#D4B896" opacity="0.8"/>
                    <!-- Sombras na mão -->
                    <ellipse cx="110" cy="530" rx="20" ry="30" fill="#C4A878" opacity="0.15"/>
                </g>
                
                <!-- Mão direita repousando -->
                <g filter="url(#shadow)">
                    <ellipse cx="390" cy="520" rx="25" ry="45" fill="url(#skinGradient)"/>
                    <!-- Dedos -->
                    <ellipse cx="405" cy="540" rx="6" ry="18" fill="#D4B896" opacity="0.8"/>
                    <ellipse cx="395" cy="555" rx="5" ry="20" fill="#D4B896" opacity="0.8"/>
                    <ellipse cx="382" cy="560" rx="6" ry="18" fill="#D4B896" opacity="0.8"/>
                    <!-- Sombras na mão -->
                    <ellipse cx="390" cy="530" rx="20" ry="30" fill="#C4A878" opacity="0.15"/>
                </g>
                
                <!-- JÓIAS/ADORNOS -->
                <!-- Colar simples -->
                <path d="M 210 420 Q 250 430 290 420" stroke="#D4AF37" stroke-width="1.5" fill="none" opacity="0.7"/>
                <!-- Pingente -->
                <circle cx="250" cy="445" r="3" fill="#D4AF37" opacity="0.8"/>
            </svg>
        </div>
        
        <footer>
            <p class="info">👀 Mova o mouse sobre os olhos para vê-los acompanharem seu movimento</p>
            <p class="credits">Obra original: Leonardo da Vinci (c. 1503-1519) | Projeto Interativo Alura</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
