<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mona Lisa Interativa</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Mona Lisa Interativa</h1>
        <p class="subtitle">Movimente o mouse e veja os olhos acompanharem!</p>
        
        <svg class="mona-lisa" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
            <!-- Fundo -->
            <defs>
                <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
                </linearGradient>
                
                <linearGradient id="skinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#E8C5A0;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#D4A574;stop-opacity:1" />
                </linearGradient>
                
                <radialGradient id="eyeGradient" cx="35%" cy="35%">
                    <stop offset="0%" style="stop-color:#F5F5DC;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#DEB887;stop-opacity:1" />
                </radialGradient>
            </defs>
            
            <!-- Fundo do quadro -->
            <rect width="400" height="500" fill="url(#skyGradient)"/>
            
            <!-- Paisagem ao fundo -->
            <ellipse cx="200" cy="350" rx="200" ry="100" fill="#8B7355" opacity="0.3"/>
            <path d="M 0 300 Q 100 250 200 280 T 400 300 L 400 500 L 0 500" fill="#6B5344" opacity="0.4"/>
            
            <!-- Pescoço -->
            <ellipse cx="200" cy="280" rx="35" ry="50" fill="#D4A574"/>
            
            <!-- Cabeça -->
            <ellipse cx="200" cy="180" rx="70" ry="85" fill="url(#skinGradient)"/>
            
            <!-- Cabelo -->
            <path d="M 140 150 Q 130 100 150 60 Q 170 40 200 35 Q 230 40 250 60 Q 270 100 260 150 Q 240 140 200 140 Q 160 140 140 150" fill="#5C4033"/>
            <path d="M 140 200 Q 120 180 110 140" stroke="#4A2C1A" stroke-width="3" fill="none" opacity="0.5"/>
            
            <!-- Orelha direita -->
            <ellipse cx="270" cy="160" rx="20" ry="35" fill="#D4A574"/>
            <ellipse cx="275" cy="165" rx="8" ry="18" fill="#C4956A" opacity="0.6"/>
            
            <!-- Orelha esquerda -->
            <ellipse cx="130" cy="160" rx="20" ry="35" fill="#D4A574"/>
            <ellipse cx="125" cy="165" rx="8" ry="18" fill="#C4956A" opacity="0.6"/>
            
            <!-- Olho esquerdo (branco) -->
            <ellipse cx="160" cy="150" rx="18" ry="24" fill="url(#eyeGradient)"/>
            
            <!-- Olho direito (branco) -->
            <ellipse cx="240" cy="150" rx="18" ry="24" fill="url(#eyeGradient)"/>
            
            <!-- Íris esquerda (vai se mover) -->
            <circle class="iris-esquerda" cx="160" cy="160" r="10" fill="#704214"/>
            
            <!-- Íris direita (vai se mover) -->
            <circle class="iris-direita" cx="240" cy="160" r="10" fill="#704214"/>
            
            <!-- Pupila esquerda -->
            <circle cx="160" cy="160" r="6" fill="#1a1a1a"/>
            <circle cx="162" cy="158" r="2" fill="#ffffff" opacity="0.8"/>
            
            <!-- Pupila direita -->
            <circle cx="240" cy="160" r="6" fill="#1a1a1a"/>
            <circle cx="242" cy="158" r="2" fill="#ffffff" opacity="0.8"/>
            
            <!-- Sombreado dos olhos -->
            <path d="M 145 145 Q 160 140 175 145" stroke="#9B8B7E" stroke-width="1.5" fill="none" opacity="0.6"/>
            <path d="M 225 145 Q 240 140 255 145" stroke="#9B8B7E" stroke-width="1.5" fill="none" opacity="0.6"/>
            
            <!-- Nariz -->
            <path d="M 200 150 L 200 200 L 195 205 M 200 200 L 205 205" stroke="#C4956A" stroke-width="2" fill="none" stroke-linecap="round"/>
            
            <!-- Boca com o sorriso misterioso -->
            <path d="M 160 230 Q 200 250 240 230" stroke="#B8714F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M 160 232 Q 200 245 240 232" fill="#D4A574" opacity="0.3"/>
            
            <!-- Sombreado do rosto -->
            <ellipse cx="140" cy="200" rx="25" ry="40" fill="#C4956A" opacity="0.15"/>
            <ellipse cx="260" cy="200" rx="25" ry="40" fill="#C4956A" opacity="0.15"/>
            
            <!-- Sobrancelhas -->
            <path d="M 145 130 Q 160 120 175 130" stroke="#5C4033" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M 225 130 Q 240 120 255 130" stroke="#5C4033" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </svg>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
